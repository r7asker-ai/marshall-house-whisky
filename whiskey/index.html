<style>
:root{--green:#5B7A5A;--brass:#8F6F3E;--slate:#2F3E46;--sand:#D8C3A5;--mist:#F2F5EF;--thistle:#9A4C9A;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;border-radius:0!important}
html,body{margin:0;background:var(--mist);color:var(--slate);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
a{color:var(--green)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{text-align:center;padding:36px 20px 18px;position:relative}
.back{position:absolute;left:14px;top:12px;font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--green);text-decoration:none;padding:10px 6px}
header img.logo{width:min(54vw,210px);height:auto;display:block;margin:0 auto}
.rule{height:1px;background:var(--brass);border:0;margin:0}
.rule.short{width:56px;margin:16px auto}
.label{font:600 11px/1.2 var(--sans);letter-spacing:.18em;text-transform:uppercase}
header .label{color:var(--brass)}
.intro{font:italic 500 19px/1.4 var(--serif);text-align:center;margin:6px auto 22px;max-width:30em}
.controls{position:sticky;top:0;z-index:5;background:var(--mist);padding:12px 0 10px;border-bottom:1px solid var(--brass)}
.search{width:100%;padding:11px 12px;font:400 16px var(--sans);color:var(--slate);background:#fff;border:1px solid var(--sand);outline:none}
.search:focus{border-color:var(--green)}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 12px/1 var(--sans);letter-spacing:.06em;padding:8px 11px;background:transparent;color:var(--green);border:1px solid var(--green);cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--green);color:#fff}
.grp{flex:none;width:52px;color:var(--brass);font-size:10px}
select{font:500 12px var(--sans);color:var(--slate);background:#fff;border:1px solid var(--sand);padding:7px 8px}
.count{font-size:12px;color:#5d6b70;margin-left:auto}
.sbox{position:relative}
.sbox .search{position:relative;background:transparent;z-index:2}
.ghost{position:absolute;inset:0;padding:12px 13px;font:400 16px var(--sans);color:transparent;white-space:pre;overflow:hidden;pointer-events:none;background:#fff;border:1px solid transparent;z-index:1}
.ghost b{font-weight:400;color:#9aa5a9}
.sugg{position:absolute;left:0;right:0;top:100%;margin:0;padding:0;list-style:none;background:#fff;border:1px solid var(--green);border-top:0;z-index:30;max-height:50vh;overflow:auto;display:none;box-shadow:0 8px 18px rgba(47,62,70,.12)}
.sugg.open{display:block}
.sugg li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:12px 13px;min-height:44px;border-top:1px solid rgba(143,111,62,.25);cursor:pointer;font-size:15px}
.sugg li[aria-selected=true],.sugg li:active{background:var(--mist)}
.sugg mark{background:none;color:var(--green);font-weight:600}
.sugg .k{font:600 9.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--brass);flex:none}
ul.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:16px 2px;border-bottom:1px solid rgba(143,111,62,.35);cursor:pointer}
.item:active{background:#fff}
.name{font:600 20px/1.2 var(--serif)}
.meta{grid-column:1;font-size:12.5px;color:#56646b}
.side{grid-row:1/3;grid-column:2;text-align:right;align-self:center}
.tier{font:600 13px var(--sans);letter-spacing:.08em;color:var(--brass)}
.tier i{font-style:normal;opacity:.25}
.stars{display:inline-flex;align-items:center;white-space:nowrap;line-height:1}
.stars .sr{position:relative;display:inline-block;width:74px;height:13px}
.stars .sr svg{display:block}
.stars .sf{position:absolute;left:0;top:0;height:13px;overflow:hidden}
.stars small{color:var(--slate);font:500 12px var(--sans);letter-spacing:0;margin-left:4px}
.nr{font-size:12px;color:#7a868b;font-style:italic}
.tag{display:inline-block;font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--green);border:1px solid var(--green);padding:4px 6px;margin-right:6px;vertical-align:1px}
.mine-dot{color:var(--thistle);font-size:10px;margin-left:6px}
.empty{text-align:center;padding:40px 0;font:italic 500 18px var(--serif)}
/* detail */
.sheet{position:fixed;inset:0;background:rgba(47,62,70,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.card{background:var(--mist);width:100%;max-width:560px;padding:26px 24px calc(24px + env(safe-area-inset-bottom));border-top:3px solid var(--brass);max-height:88vh;overflow:auto;position:relative}
.card h2{font:600 28px/1.15 var(--serif);margin:8px 0 6px}
.card{padding-top:0}
.pic{margin:0 -24px 18px;height:300px;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--brass)}
.pic img{max-height:280px;max-width:100%;width:auto;height:auto;display:block;opacity:0;transition:opacity .3s}
.pic img.ok{opacity:1}
.grid{grid-template-columns:96px 1fr}
.taste{margin:0 0 18px}
.taste h3,.about h3{font:600 10.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin:0 0 10px}
.taste p{margin:0 0 8px;font-size:14.5px}
.taste p b{display:inline-block;width:62px;font:600 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#5d6b70}
.about{padding:16px 0 18px;border-top:1px solid var(--brass);margin-bottom:6px}
.about p{margin:0;font:500 17px/1.45 var(--serif)}
.card .label{color:var(--brass)}
dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:20px 0;padding:16px 0;border-top:1px solid var(--brass);border-bottom:1px solid var(--brass)}
dt{font:600 10.5px/1.6 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#5d6b70}
dd{margin:0;font-size:15px}
.btn{display:block;width:100%;padding:15px;font:600 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;background:var(--green);color:#fff;border:1px solid var(--green);cursor:pointer}
.btn.ghost{background:transparent;color:var(--green)}
.close{position:absolute;top:10px;right:12px;background:none;border:0;font:500 28px/1 var(--serif);color:var(--slate);cursor:pointer;padding:6px}
/* my choice */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--slate);color:var(--mist);z-index:10;border-top:2px solid var(--brass);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:0}
.bar .label{color:var(--sand)}
.bar .sel{flex:1;font:italic 500 17px/1.25 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button{background:transparent;color:var(--mist);border:1px solid var(--sand);font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:9px 12px;cursor:pointer}
.choice-pic{display:flex;justify-content:center;align-items:center;height:min(52vh,420px);margin:14px 0 10px;background:#fff;border-top:1px solid var(--brass);border-bottom:1px solid var(--brass)}
.choice-pic img{max-height:94%;max-width:100%;display:block}
.choice-name{text-align:center;margin:14px 0 4px!important}
.choice-act{text-align:center;margin:6px 0 4px}
.link{background:none;border:0;padding:8px;font:500 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--green);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.mine{list-style:none;padding:0;margin:14px 0 20px}
.mine li{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(143,111,62,.4);font:600 19px var(--serif)}
.mine li button{background:none;border:0;color:var(--green);font:500 12px var(--sans);text-decoration:underline;cursor:pointer}
footer{text-align:center;padding:34px 20px 20px;font-size:12px;color:#5d6b70}
footer .label{color:var(--brass);font-size:10px}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='mh-whisky-choice';
let mine=[];try{mine=JSON.parse(localStorage.getItem(KEY)||'[]').slice(-1)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(mine))}catch(e){};bar();render()};
const F={region:new Set(),style:new Set(),cask:new Set()};
const tierTxt=n=>'£'.repeat(n);
const tierHtml=n=>n?'£'.repeat(n)+'<i>'+'£'.repeat(5-n)+'</i>':'';
const STAR='M7 .6l1.9 4.1 4.5.5-3.4 3 1 4.4L7 10.3 3 12.6l1-4.4-3.4-3 4.5-.5z';
const ROW=c=>`<svg viewBox="0 0 74 13" width="74" height="13" aria-hidden="true" focusable="false">${[0,1,2,3,4].map(i=>`<path transform="translate(${i*15} 0)" d="${STAR}" fill="${c}"/>`).join('')}</svg>`;
const ROW_E=ROW('#D8C3A5'),ROW_F=ROW('#8F6F3E');
function stars(r){if(r==null)return '<span class="nr">Not rated</span>';const h=Math.round(r*2)/2;const w=(Math.floor(h)*15+(h%1?7:0)).toFixed(1);return `<span class="stars" role="img" aria-label="${r.toFixed(1)} out of 5"><span class="sr">${ROW_E}<span class="sf" style="width:${w}px">${ROW_F}</span></span><small>${r.toFixed(1)}</small></span>`}
function chips(id,key,vals,lab){const el=$(id);el.innerHTML=vals.map(v=>`<button class="chip" aria-pressed="false" data-v="${esc(v)}">${esc(lab?lab(v):v)}</button>`).join('');
 el.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const v=b.dataset.v;F[key].has(v)?F[key].delete(v):F[key].add(v);b.setAttribute('aria-pressed',F[key].has(v));render()}}
chips('#f-region','region',D.regions);chips('#f-style','style',D.styles);chips('#f-cask','cask',D.casks);
function meta(b){return [b.age,b.region,b.abv].filter(Boolean).map(esc).join(' · ')}
function render(){
 const q=$('#q').value.trim().toLowerCase();
 let L=D.bottles.filter(b=>(!F.region.size||F.region.has(b.region))&&(!F.style.size||b.styles.some(s=>F.style.has(s)))&&(!F.cask.size||F.cask.has(b.caskType))&&(!q||[b.name,b.region,b.styles.join(' '),b.caskType==='Unknown'?'':b.caskType,b.cask,b.age,b.notes,b.distillery,b.bottler].join(' ').toLowerCase().includes(q)));
 const nm=(a,b)=>a.name.localeCompare(b.name,'en-GB');
 L.sort(nm);
 $('#count').textContent=L.length+' of '+D.bottles.length;
 $('#list').innerHTML=L.length?L.map(b=>`<li class="item" data-id="${b.id}"><div class="name">${esc(b.name)}${mine.includes(b.id)?'<span class="mine-dot" title="In my choice">◆</span>':''}</div><div class="side"><div class="tier">${tierHtml(b.tierN)}</div>${stars(b.rating)}</div><div class="meta">${b.styles.slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${meta(b)}</div></li>`).join(''):'<li class="empty">Nothing matches that. Try fewer filters.</li>';
}
function open(html){$('#card').innerHTML='<button class="close" aria-label="Close">×</button>'+html;$('#sheet').classList.add('open')}
function shut(){$('#sheet').classList.remove('open')}
function detail(id){const b=D.bottles.find(x=>x.id===id);const has=mine.includes(id);
 const rows=[['Distillery',b.distillery],['Owner',b.owner],['Bottler',b.bottler],['Region',b.region],['Founded',b.founded],['Status',b.status],['Style',b.styles.join(', ')],['Cask type',b.caskType==='Unknown'?'':b.caskType],['Age',b.age],['Cask',b.cask],['Strength',b.abv],['Size',b.size],['Bottling',b.notes]].filter(r=>r[1]);
 const t=[['Nose',b.nose],['Palate',b.palate],['Finish',b.finish]].filter(r=>r[1]);
 open(`<div class="pic"><img src="${b.img||'img/placeholder.svg'}" alt="${esc(b.name)}" loading="lazy" decoding="async" onload="this.classList.add('ok')" onerror="this.onerror=null;this.src='img/placeholder.svg'"></div>
 <div class="label">${esc(b.region)}</div><h2>${esc(b.name)}</h2><div class="tier" style="font-size:16px">${tierHtml(b.tierN)}</div><div style="margin-top:4px">${stars(b.rating)}</div>
 <dl class="grid">${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>
 ${t.length?`<div class="taste"><h3>Tasting notes</h3>${t.map(r=>`<p><b>${r[0]}</b>${esc(r[1])}</p>`).join('')}</div>`:''}
 ${b.about?`<div class="about"><h3>About</h3><p>${esc(b.about)}</p></div>`:''}
 ${has?'<p class="label" style="text-align:center;color:var(--green);margin:4px 0 10px">Your choice</p>':''}<button class="btn" id="pick" data-id="${id}">I’ll have this</button>`)}
function list(){const b=mine.length&&D.bottles.find(x=>x.id===mine[0]);
 open(b?`<div class="label" style="text-align:center;padding-top:22px">My choice</div><div class="choice-pic"><img src="${b.img||'img/placeholder.svg'}" alt="${esc(b.name)}" decoding="async" onerror="this.onerror=null;this.src='img/placeholder.svg'"></div><h2 class="choice-name">${esc(b.name)}</h2><p class="choice-act"><button class="link" id="clear">Clear choice</button></p>`
 :'<div class="label" style="text-align:center;padding-top:22px">My choice</div><p class="intro">Nothing chosen yet. Tap a bottle to have a look.</p>')}
function bar(){mine=mine.filter(id=>D.bottles.some(b=>b.id===id));$('#sel').textContent=mine.length?D.bottles.find(b=>b.id===mine[0]).name:'Nothing chosen yet'}
$('#list').onclick=e=>{const li=e.target.closest('.item');if(li)detail(+li.dataset.id)};
$('#sheet').onclick=e=>{if(e.target.id==='sheet'||e.target.closest('.close'))return shut();
 const p=e.target.closest('#pick');if(p){const id=+p.dataset.id;mine=[id];save();list();return}
 if(e.target.id==='clear'){mine=[];save();list()}};
$('#bar').onclick=list;
document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});

// ---- autocomplete ----
const AC=[...D.bottles.map(b=>({t:b.name,k:'Bottle'})).sort((a,b)=>a.t.localeCompare(b.t,'en-GB')),...D.regions.map(t=>({t,k:'Region'})),...D.styles.map(t=>({t,k:'Style'})),...D.casks.map(t=>({t,k:'Cask'}))];
const qi=$('#q'),gh=$('#ghost'),sg=$('#sugg');let hits=[],sel=-1;
function wpos(t,q){const l=t.toLowerCase();if(l.startsWith(q))return 0;const re=/[\s\-&(\/.,']+/g;let m;while((m=re.exec(l))){if(l.startsWith(q,m.index+m[0].length))return m.index+m[0].length}return -1}
function ac(){const raw=qi.value,q=raw.toLowerCase().trim();sel=-1;
 if(!q){hits=[];sg.classList.remove('open');qi.setAttribute('aria-expanded','false');gh.innerHTML='';return}
 hits=AC.map(o=>({...o,p:wpos(o.t,q)})).filter(o=>o.p>=0&&o.t.toLowerCase()!==q).sort((a,b)=>(a.k==='Bottle'?0:1)-(b.k==='Bottle'?0:1)||(a.p>0)-(b.p>0)).slice(0,8);
 sg.innerHTML=hits.map((o,i)=>`<li role="option" data-i="${i}"><span>${esc(o.t.slice(0,o.p))}<mark>${esc(o.t.slice(o.p,o.p+q.length))}</mark>${esc(o.t.slice(o.p+q.length))}</span><span class="k">${o.k}</span></li>`).join('');
 sg.classList.toggle('open',hits.length>0);qi.setAttribute('aria-expanded',hits.length>0);ghost()}
function ghost(){const raw=qi.value,top=hits.find(o=>o.p===0);gh.innerHTML=top&&raw&&top.t.toLowerCase().startsWith(raw.toLowerCase())?esc(raw)+'<b>'+esc(top.t.slice(raw.length))+'</b>':''}
function pick(t){qi.value=t;hits=[];sg.classList.remove('open');qi.setAttribute('aria-expanded','false');gh.innerHTML='';render()}
qi.addEventListener('input',()=>{render();ac()});
qi.addEventListener('keydown',e=>{const top=hits.find(o=>o.p===0);
 if((e.key==='Tab'||(e.key==='ArrowRight'&&qi.selectionStart===qi.value.length))&&gh.textContent){e.preventDefault();pick(top.t)}
 else if(e.key==='ArrowDown'&&hits.length){e.preventDefault();sel=(sel+1)%hits.length;mark_()}
 else if(e.key==='ArrowUp'&&hits.length){e.preventDefault();sel=(sel-1+hits.length)%hits.length;mark_()}
 else if(e.key==='Enter'){if(sel>=0)pick(hits[sel].t);else{sg.classList.remove('open');qi.blur()}}
 else if(e.key==='Escape'){sg.classList.remove('open');gh.innerHTML=''}});
function mark_(){[...sg.children].forEach((li,i)=>li.setAttribute('aria-selected',i===sel))}
sg.addEventListener('pointerdown',e=>{const li=e.target.closest('li');if(li){e.preventDefault();pick(hits[+li.dataset.i].t)}});
qi.addEventListener('blur',()=>setTimeout(()=>{sg.classList.remove('open');gh.innerHTML=''},150));
qi.addEventListener('focus',ac);

bar();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('../sw.js?v=ea50f30b',{scope:'../'}).catch(()=>{}));
</script>
</body>
</html>
