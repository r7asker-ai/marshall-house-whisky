<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marshall House - Bar</title>
<meta name="application-name" content="Marshall House - Bar">
<meta name="apple-mobile-web-app-title" content="Marshall House - Bar">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F5EF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#5B7A5A;--brass:#8F6F3E;--slate:#2F3E46;--sand:#D8C3A5;--mist:#F2F5EF;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;border-radius:0!important}
html,body{margin:0;background:var(--mist);color:var(--slate);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 20px calc(24px + env(safe-area-inset-bottom))}
header{text-align:center;padding:40px 20px 6px}
header img{width:min(54vw,210px);height:auto;display:block;margin:0 auto}
.rule{height:1px;background:var(--brass);border:0;width:56px;margin:18px auto}
.intro{font:italic 500 19px/1.4 var(--serif);text-align:center;margin:0 auto 22px;max-width:24em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;list-style:none;margin:0;padding:0}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:1/1;background:#fff;border:1px solid var(--sand);color:var(--slate);text-decoration:none;position:relative;text-align:center}
.tile::after{content:"";position:absolute;inset:5px;border:1px solid rgba(143,111,62,.35);pointer-events:none}
a.tile{border-color:var(--brass)}
a.tile:active{background:var(--slate);color:var(--mist)}
.tile svg{width:44px;height:44px;fill:none;stroke:var(--brass);stroke-width:1.6;stroke-linecap:square}
.tile .t{font:600 24px/1 var(--serif);letter-spacing:.04em}
.tile .t.sm{font-size:18px;letter-spacing:.02em;white-space:nowrap}
.tile .t.sm.wrap2{white-space:normal;line-height:1.1;padding:0 14px;text-wrap:balance}
.tile .s{font:600 10px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--green)}
.tile.soon{opacity:.62}.tile.soon .s{color:#7a868b}
footer{text-align:center;padding:30px 20px 20px;font:600 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--brass)}
</style>
</head>
<body>
<header><h1 style="margin:0"><img src="logo.svg" alt="Marshall House · Bar" width="200" height="182"></h1><hr class="rule"></header>
<main class="wrap">
<p class="intro">Welcome. What are you in the mood for?</p>
<ul class="tiles"><li><a class="tile" href="beers/"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 14h20v26a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3zM34 19h4a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-4M14 14c0-4 3-6 6-5 1-3 7-3 8 0 3-1 6 1 6 5"/></svg><span class="t sm">Beers & Ciders</span><span class="s">View menu</span></a></li><li><a class="tile" href="wines/"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 6h16c0 10 2 20-8 21-10-1-8-11-8-21zM24 27v14M17 42h14M16.5 14h15"/></svg><span class="t">Wines</span><span class="s">View menu</span></a></li><li><a class="tile" href="whiskey/"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 12h22l-3 29H16zM14.5 26h19M19 32l4-3 5 2"/></svg><span class="t">Whiskeys</span><span class="s">View menu</span></a></li><li><a class="tile" href="cocktails/"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 8h32L24 26zM24 26v15M16 42h16M30 4l-6 10M13 13h22"/></svg><span class="t">Cocktails</span><span class="s">View menu</span></a></li></ul>
</main>
<footer>Please drink responsibly</footer>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js?v=74c633c1').catch(()=>{}));</script>
</body>
</html>
